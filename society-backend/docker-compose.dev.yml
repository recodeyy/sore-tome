# Local development dependencies: Postgres (with pgvector) + Redis.
# Usage: docker compose -f docker-compose.dev.yml up -d
services:
  postgres:
    image: pgvector/pgvector:pg16
    environment:
      POSTGRES_USER: sero
      POSTGRES_PASSWORD: sero
      POSTGRES_DB: sero_dev
    ports:
      - "5544:5432" # 5544 on host to avoid a pre-existing local Postgres on 5432
    volumes:
      - sero_pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U sero -d sero_dev"]
      interval: 5s
      timeout: 5s
      retries: 10

  redis:
    image: redis:7-alpine
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10

volumes:
  sero_pgdata:
