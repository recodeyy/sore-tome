# nginx load balancer → backend replicas (docker compose DNS round-robins
# the "backend" service name across scaled replicas).
upstream sero_api {
    server backend:3001 max_fails=3 fail_timeout=5s;
    keepalive 256;
}

server {
    listen 80;
    location / {
        proxy_pass http://sero_api;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_read_timeout 60s;
        # SSE (realtime) needs buffering off
        proxy_buffering off;
    }
}
