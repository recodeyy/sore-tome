name: CI

on:
  push:
    branches: [master]
  pull_request:
    branches: [master]

jobs:
  backend:
    name: Backend (build, migrate, test)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: society-backend

    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: sero
          POSTGRES_PASSWORD: sero
          POSTGRES_DB: sero_test
        ports:
          - 5432:5432
        # Wait until Postgres is ready before steps run.
        options: >-
          --health-cmd "pg_isready -U sero -d sero_test"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 10
      redis:
        image: redis:7
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 10

    env:
      # Code reads these directly: src/shared/Database.ts -> DATABASE_URL,
      # src/shared/Redis.ts -> REDIS_URL. knexfile.js also uses DATABASE_URL.
      # "localhost" in the URL makes Database.ts disable SSL (see ternary there).
      DATABASE_URL: postgres://sero:sero@localhost:5432/sero_test
      REDIS_URL: redis://localhost:6379
      NODE_ENV: test

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          # package.json engines: "node": ">=22 <25" -> use 22 LTS.
          node-version: "22"
          cache: npm
          cache-dependency-path: society-backend/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Run migrations
        run: npx knex migrate:latest

      - name: Type-check
        run: npx tsc --noEmit

      - name: Test
        run: npx jest __tests__/ --runInBand

  # NOTE: k6 smoke/load tests (see __tests__/stress_test.js and k6 scripts) are
  # intentionally NOT run here — they require a deployed, running target. Run k6
  # against a staging/preview URL in a separate post-deploy workflow.
